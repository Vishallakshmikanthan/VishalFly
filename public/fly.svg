<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="flyBody" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#78350f" />
    </radialGradient>
    <radialGradient id="wingGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.85)" />
      <stop offset="100%" stop-color="rgba(147,197,253,0.3)" />
    </radialGradient>
  </defs>
  <!-- Wings -->
  <ellipse cx="32" cy="40" rx="20" ry="10" transform="rotate(-30 32 40)" fill="url(#wingGrad)" stroke="rgba(255,255,255,0.7)" stroke-width="1.5" />
  <ellipse cx="68" cy="40" rx="20" ry="10" transform="rotate(30 68 40)" fill="url(#wingGrad)" stroke="rgba(255,255,255,0.7)" stroke-width="1.5" />
  <!-- Fly Body -->
  <ellipse cx="50" cy="56" rx="14" ry="20" fill="url(#flyBody)" />
  <!-- Thorax / Head -->
  <circle cx="50" cy="38" r="10" fill="#451a03" />
  <circle cx="50" cy="27" r="7" fill="#262626" />
  <!-- Eyes -->
  <circle cx="44" cy="25" r="4.5" fill="#dc2626" />
  <circle cx="56" cy="25" r="4.5" fill="#dc2626" />
  <circle cx="45" cy="24" r="1.5" fill="#fef2f2" />
  <circle cx="57" cy="24" r="1.5" fill="#fef2f2" />
  <!-- Antennae -->
  <path d="M47 21 Q42 12 36 14" stroke="#e5e5e5" stroke-width="2" stroke-linecap="round" fill="none" />
  <path d="M53 21 Q58 12 64 14" stroke="#e5e5e5" stroke-width="2" stroke-linecap="round" fill="none" />
</svg>
